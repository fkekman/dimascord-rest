name: dimascord-test
services:
  postgres-test:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: dimascord_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: dimascord_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dimascord_test -d dimascord_test']
      interval: 2s
      timeout: 3s
      retries: 30
