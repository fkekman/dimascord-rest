name: dimascord
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    ports:
      - '127.0.0.1:${DB_PORT:?Set DB_PORT in .env}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build:
      context: .
      target: production
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      PORT: ${PORT:?Set PORT in .env}
    ports:
      - '${PORT:?Set PORT in .env}:${PORT:?Set PORT in .env}'
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
